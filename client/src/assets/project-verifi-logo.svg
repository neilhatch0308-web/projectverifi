<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 210" width="740" height="210">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=IBM+Plex+Mono:wght@500&amp;family=Inter:wght@500&amp;display=swap');
    .word-a    { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 58px; fill: #14161C; }
    .word-b    { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 58px; fill: #17C3B2; }
    .tagline   { font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 12px; fill: #7A8093; letter-spacing: 3px; }
    .endorse   { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 12.5px; fill: #9AA0AE; letter-spacing: 0.5px; }
  </style>

  <!-- Seal mark: ascending steps = progress/milestones -->
  <g transform="translate(88,88)">
    <circle r="62" fill="#F4F5F8" stroke="#17C3B2" stroke-width="4.5"/>
    <circle r="48" fill="none" stroke="#DADFE8" stroke-width="1.4"/>
    <path d="M -25 15 L -9 15 L -9 -1 L 7 -1 L 7 -17 L 23 -17" fill="none" stroke="#14161C" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="178" y="98">
    <tspan class="word-a">Project</tspan><tspan class="word-b"> Verifi</tspan>
  </text>
  <text x="180" y="126" class="tagline">SCOPED · TRACKED · DELIVERED</text>
  <text x="180" y="152" class="endorse">part of we-verifi</text>
</svg>
